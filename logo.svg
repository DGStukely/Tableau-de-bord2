<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="innerClip">
      <circle cx="100" cy="100" r="72"/>
    </clipPath>
  </defs>

  <!-- Anneau extérieur teal -->
  <circle cx="100" cy="100" r="98" fill="#1e7b6a"/>
  <!-- Filet doré -->
  <circle cx="100" cy="100" r="93" fill="none" stroke="#c9a84c" stroke-width="2.5"/>
  <!-- Cercle blanc intérieur -->
  <circle cx="100" cy="100" r="72" fill="white"/>

  <!-- Ciel -->
  <rect x="28" y="28" width="144" height="144" fill="#b8dff0" clip-path="url(#innerClip)"/>
  <!-- Collines arrière -->
  <ellipse cx="100" cy="145" rx="82" ry="42" fill="#6baa7c" clip-path="url(#innerClip)"/>
  <!-- Collines avant -->
  <ellipse cx="100" cy="160" rx="82" ry="36" fill="#4d9460" clip-path="url(#innerClip)"/>

  <!-- Église -->
  <rect x="86" y="93" width="28" height="36" fill="white" stroke="#ccc" stroke-width="0.8" clip-path="url(#innerClip)"/>
  <polygon points="100,75 82,95 118,95" fill="#7a5c3c" clip-path="url(#innerClip)"/>
  <rect x="97" y="59" width="6" height="18" fill="#7a5c3c" clip-path="url(#innerClip)"/>
  <polygon points="100,52 95,61 105,61" fill="#5a3c1c" clip-path="url(#innerClip)"/>
  <rect x="95" y="111" width="10" height="18" fill="#c8a87e" rx="5" clip-path="url(#innerClip)"/>
  <ellipse cx="89" cy="101" rx="3" ry="5" fill="#b8dff0" stroke="#aaa" stroke-width="0.5" clip-path="url(#innerClip)"/>
  <ellipse cx="111" cy="101" rx="3" ry="5" fill="#b8dff0" stroke="#aaa" stroke-width="0.5" clip-path="url(#innerClip)"/>

  <!-- Maison gauche -->
  <rect x="51" y="105" width="26" height="24" fill="white" stroke="#ccc" stroke-width="0.6" clip-path="url(#innerClip)"/>
  <polygon points="51,106 64,89 77,106" fill="#c04040" clip-path="url(#innerClip)"/>
  <rect x="59" y="115" width="10" height="14" fill="#c8a87e" clip-path="url(#innerClip)"/>
  <rect x="53" y="110" width="6" height="6" fill="#b8dff0" stroke="#aaa" stroke-width="0.5" clip-path="url(#innerClip)"/>

  <!-- Maison droite -->
  <rect x="123" y="107" width="24" height="22" fill="white" stroke="#ccc" stroke-width="0.6" clip-path="url(#innerClip)"/>
  <polygon points="123,108 135,93 147,108" fill="#7a5c3c" clip-path="url(#innerClip)"/>
  <rect x="129" y="117" width="10" height="12" fill="#c8a87e" clip-path="url(#innerClip)"/>
  <rect x="139" y="112" width="6" height="6" fill="#b8dff0" stroke="#aaa" stroke-width="0.5" clip-path="url(#innerClip)"/>

  <!-- Arbres gauche -->
  <rect x="33" y="120" width="5" height="18" fill="#5a3a1a" clip-path="url(#innerClip)"/>
  <ellipse cx="36" cy="113" rx="10" ry="12" fill="#2d6a3e" clip-path="url(#innerClip)"/>
  <rect x="42" y="124" width="4" height="14" fill="#5a3a1a" clip-path="url(#innerClip)"/>
  <ellipse cx="44" cy="119" rx="8" ry="10" fill="#3d8a4e" clip-path="url(#innerClip)"/>

  <!-- Arbres droite -->
  <rect x="158" y="120" width="5" height="18" fill="#5a3a1a" clip-path="url(#innerClip)"/>
  <ellipse cx="161" cy="113" rx="10" ry="12" fill="#2d6a3e" clip-path="url(#innerClip)"/>
  <rect x="149" y="124" width="4" height="14" fill="#5a3a1a" clip-path="url(#innerClip)"/>
  <ellipse cx="151" cy="119" rx="8" ry="10" fill="#3d8a4e" clip-path="url(#innerClip)"/>

  <!-- Reflet eau -->
  <ellipse cx="100" cy="162" rx="26" ry="6" fill="#7bbfd8" opacity="0.65" clip-path="url(#innerClip)"/>

  <!-- VILLAGE (haut, courbe) -->
  <path id="topArc" d="M 12,100 A 88,88 0 0,0 188,100" fill="none"/>
  <text font-family="Georgia,serif" font-size="15" font-weight="bold" fill="white" letter-spacing="5">
    <textPath href="#topArc" startOffset="18%">VILLAGE</textPath>
  </text>

  <!-- STUKELY-SUD (bas, courbe) -->
  <path id="botArc" d="M 188,100 A 88,88 0 0,1 12,100" fill="none"/>
  <text font-family="Georgia,serif" font-size="12" font-weight="bold" fill="white" letter-spacing="2">
    <textPath href="#botArc" startOffset="10%">STUKELY-SUD</textPath>
  </text>

  <!-- Points dorés décoratifs -->
  <circle cx="12" cy="100" r="3" fill="#c9a84c"/>
  <circle cx="188" cy="100" r="3" fill="#c9a84c"/>
</svg>
